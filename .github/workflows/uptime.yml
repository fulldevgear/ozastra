name: Monitor public site

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-public-site
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke ozastra.com
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check public pages
        env:
          OZASTRA_SMOKE_BASE_URL: https://ozastra.com
        run: node scripts/smoke-github-pages.mjs
