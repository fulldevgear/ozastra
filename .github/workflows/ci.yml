name: Quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate roadmap
        run: pnpm roadmap:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Production build and prerender
        run: pnpm build

      - name: Enforce bundle budgets
        run: pnpm check:bundle

      - name: Lighthouse budgets
        run: pnpm audit:lighthouse
